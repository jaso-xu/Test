<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · Snake</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }
  .wrap { width: min(520px, 100%); text-align: center; }
  h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: 2px; }
  p { color: #94a3b8; margin: 4px 0 16px; }
  .score { display: flex; gap: 12px; justify-content: center; margin-bottom: 12px; }
  .score div {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 8px 18px; min-width: 120px;
  }
  .score b { display: block; font-size: 22px; color: #4ade80; }
  .score span { font-size: 12px; color: #94a3b8; }
  canvas {
    width: 100%; max-width: 480px; aspect-ratio: 1;
    background: #020617; border: 2px solid #334155; border-radius: 16px;
    display: block; margin: 0 auto;
  }
  .btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  button {
    border: 0; border-radius: 999px; padding: 10px 22px; font-size: 15px;
    background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer;
  }
  button.secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
  .pad { display: none; margin: 16px auto 0; width: 150px; }
  .pad button { width: 48px; height: 48px; padding: 0; font-size: 20px; }
  .pad .row { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
  @media (max-width: 600px) { .pad { display: block; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐍 贪吃蛇</h1>
  <p>方向键 / WASD 移动，空格暂停，吃得越多速度越快</p>
  <div class="score">
    <div><b id="score">0</b><span>分数</span></div>
    <div><b id="best">0</b><span>最高分</span></div>
  </div>
  <canvas id="game" width="480" height="480"></canvas>
  <div class="btns">
    <button id="startBtn">开始 / 重新开始</button>
    <button id="pauseBtn" class="secondary">暂停</button>
  </div>
  <div class="pad">
    <div class="row"><button data-dir="up">↑</button></div>
    <div class="row">
      <button data-dir="left">←</button>
      <button data-dir="down">↓</button>
      <button data-dir="right">→</button>
    </div>
  </div>
</div>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const CELL = 20, COLS = 24, ROWS = 24;
  let snake, dir, nextDir, food, score, best, timer, running, paused;

  best = Number(localStorage.getItem('snake-best') || 0);
  bestEl.textContent = best;

  function randomFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) return f;
    }
  }
  function reset() {
    snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    dir = { x: 1, y: 0 }; nextDir = dir;
    score = 0; scoreEl.textContent = '0';
    food = randomFood(); paused = false;
    document.getElementById('pauseBtn').textContent = '暂停';
  }
  function draw() {
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, 480, 480);
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(food.x * CELL + 10, food.y * CELL + 10, 8, 0, Math.PI * 2);
    ctx.fill();
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
    if (!running) {
      ctx.fillStyle = 'rgba(2,6,23,0.75)';
      ctx.fillRect(0, 0, 480, 480);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(score > 0 || snake.length > 3 ? '游戏结束' : '点开始，开始游戏', 240, 230);
      ctx.font = '16px sans-serif'; ctx.fillStyle = '#94a3b8';
      ctx.fillText('方向键 / WASD 移动，空格暂停', 240, 265);
    }
  }
  function step() {
    if (!running || paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) { running = false; clearInterval(timer); draw(); return; }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10; scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snake-best', best); }
      food = randomFood();
      clearInterval(timer);
      timer = setInterval(step, Math.max(70, 140 - Math.floor(score / 50) * 10));
    } else {
      snake.pop();
    }
    draw();
  }
  function start() {
    clearInterval(timer); reset(); running = true;
    timer = setInterval(step, 140); draw();
  }
  function setDir(x, y) {
    if (dir.x + x === 0 && dir.y + y === 0) return;
    nextDir = { x, y };
  }
  document.getElementById('startBtn').onclick = start;
  document.getElementById('pauseBtn').onclick = () => {
    if (!running) return;
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? '继续' : '暂停';
  };
  document.querySelectorAll('.pad button').forEach(b => {
    b.onclick = () => {
      const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[b.dataset.dir];
      setDir(d[0], d[1]);
    };
  });
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (k === ' ') { e.preventDefault(); document.getElementById('pauseBtn').click(); }
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  });
  let tx = 0, ty = 0;
  canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });
  reset(); running = false; draw();
</script>
</body>
</html>
